[package]
name = "supervisor-rs"
version = "0.1.0"
edition = "2021"
description = "A process control system for UNIX, reimplemented in Rust (core/MVP) — inspired by Supervisor (supervisord.org)."
license = "BSD-3-Clause"
repository = "https://github.com/juhniorsantos/supervisor"

[lib]
name = "supervisor"
path = "src/lib.rs"

[[bin]]
name = "supervisord"
path = "src/bin/supervisord.rs"

[[bin]]
name = "supervisorctl"
path = "src/bin/supervisorctl.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
