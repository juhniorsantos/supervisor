; Example configuration for the Rust core of supervisor.
;
; Run it with:
;   supervisord -c examples/supervisord.conf
; and then, in another terminal:
;   supervisorctl -c examples/supervisord.conf status

[unix_http_server]
file=/tmp/supervisor.sock        ; path to the control socket
;username=user                   ; optional HTTP Basic auth
;password=123

[inet_http_server]               ; TCP control + web UI (browse http://127.0.0.1:9001/)
port=127.0.0.1:9001              ; use *:9001 to bind all interfaces
;username=user
;password=123

[supervisord]
logfile=/tmp/supervisord.log     ; main activity log
logfile_maxbytes=50MB            ; rotate after this size
logfile_backups=10               ; keep this many rotated copies
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp                 ; where AUTO child logs are written
nodaemon=false                   ; set true (or pass -n) to run in foreground

[program:clock]
command=/bin/sh -c 'while true; do date; sleep 5; done'
autostart=true
autorestart=true                 ; always restart if it exits
startsecs=1                      ; must stay up 1s to be RUNNING
stdout_logfile=AUTO              ; -> /tmp/clock-stdout.log

[program:web]
command=python3 -m http.server 8000
directory=/tmp
autostart=false                  ; start it manually: supervisorctl start web
autorestart=unexpected           ; restart only on an unexpected exit code
exitcodes=0
startsecs=2
startretries=3
stopsignal=INT                   ; Ctrl-C equivalent for a graceful stop
stopwaitsecs=10

; Bundle programs into a group; control them as "demo:clock", "demo:web".
[group:demo]
programs=clock,web
priority=999

; An event listener receives PROCESS_STATE_* and tick events on stdin and
; replies with the READY / RESULT protocol. See the README for the format.
;[eventlistener:notify]
;command=/path/to/listener.py
;events=PROCESS_STATE,TICK_60
;buffer_size=20

; Pull in extra [program:x]/[group:x] files (globs allowed, relative to here).
;[include]
;files=conf.d/*.conf
